<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job listing</title>
</head>
<body>
    <h1>Available jobs</h1>
    <ul>
        {%for job in jobs%}
        <li><a href="{% url 'job_details' job_id=job.id %}">{{job.title}}</a> at {{job.location}}</li>
        {%endfor%}
    </ul>
</body>
</html>
